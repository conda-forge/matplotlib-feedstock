# Full credit goes to https://github.com/conda/conda-recipes for providing this recipe.
# It has been subsequently adapted for automated building with conda-forge.

{% set version = "3.11.2" %}

package:
  name: matplotlib-suite
  version: {{ version }}

source:
  url: https://github.com/matplotlib/matplotlib/archive/v{{ version }}.tar.gz
  sha256: 14b555ae7477ff593d842fba9714b5cbc6ea1db9461d2ea9d6da3ec0dc420f1a

build:
  number: 1
  skip: true  # [py<311]

# to avoid creating redundant CI jobs, conda-smithy needs python
# to be used in all outputs, including the implicit global one.
requirements:
  host:
    - python

outputs:
  - name: matplotlib-base
    script: build_base.bat  # [win]
    script: build_base.sh  # [not win]
    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
        - numpy                                  # [build_platform != target_platform]
        - pybind11 >=2.6                         # [build_platform != target_platform]
        - {{ stdlib('c') }}
        - {{ compiler('c') }}
        - {{ compiler('cxx') }}
        - cmake                                  # [win]
        - pkg-config
        - libtool                                # [unix]
        - ninja
      host:
        - python
        - python-build
        - pip
        - meson-python >=0.13.1
        - certifi >=2020.06.20
        - pybind11 >=2.13.2,!=2.13.3
        - freetype
        - libraqm-devel
        - qhull
        - numpy
        - setuptools >=64
        - setuptools_scm >=7,<10
        - setuptools_scm_git_archive
        - tk  # [linux]
      run:
        - python
        - contourpy >=1.0.1
        - cycler >=0.10
        - fonttools >=4.28.2
        - kiwisolver >=1.3.1
        - numpy >=1.25
        - packaging >=20.0
        - pillow >=9
        - pyparsing >=3
        - python-dateutil >=2.7
        - freetype
        - tk  # [linux]
    test:
      requires:
        - xorg-libx11   # [not win]
      imports:
        - matplotlib
        - matplotlib.pyplot
        - matplotlib._c_internal_utils
        - matplotlib._image
        - matplotlib._path
        - matplotlib._qhull
        - matplotlib._tri
        - matplotlib.backends._backend_agg
        - matplotlib.ft2font
        - matplotlib.backends._tkagg  # [not win and not ppc64le]
        - mpl_toolkits
        - pylab

  - name: matplotlib
    requirements:
      host:
        - python
      run:
        - python
        # osx has its own backend; pyside6 not available on ppc;
        # pyside6 supports only gil enabled cpython
        - pyside6 >=6.7.2  # [python_impl == "cpython" and (not is_freethreading) and not (osx or ppc64le) and not is_freethreading]
        - tornado >=5
        - {{ pin_subpackage('matplotlib-base', max_pin="x.x.x") }}
    test:
      imports:
        - matplotlib

about:
  home: http://matplotlib.org/
  license: PSF-2.0
  license_url: http://matplotlib.sourceforge.net/users/license.html
  license_family: PSF
  license_file:
    - LICENSE/LICENSE
    - LICENSE/LICENSE_AMSFONTS
    - LICENSE/LICENSE_BAKOMA
    - LICENSE/LICENSE_COLORBREWER
    - LICENSE/LICENSE_COURIERTEN
    - LICENSE/LICENSE_LAST_RESORT_FONT
    - LICENSE/LICENSE_QT4_EDITOR
    - LICENSE/LICENSE_SOLARIZED
    - LICENSE/LICENSE_STIX
    - LICENSE/LICENSE_YORICK
  summary: Publication quality figures in Python
  description: |
    matplotlib is a python 2D plotting library which produces publication
    quality figures in a variety of hardcopy formats and interactive
    environments across platforms. matplotlib can be used in Python scripts,
    the Python and IPython shell (ala MATLAB or Mathematica), web
    application servers, and six graphical user interface toolkits.
  dev_url: https://github.com/matplotlib/matplotlib/
  doc_url: http://matplotlib.org/contents.html

extra:
  recipe-maintainers:
    - mdboom
    - ocefpaf
    - pelson
    - tacaswell
    - dopplershift
